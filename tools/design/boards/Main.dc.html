<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main ride screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:240px;height:320px;box-sizing:border-box;overflow:hidden;background:#0B0D10;color:#F2F5F8;font-family:'Barlow','Arial',sans-serif;display:flex;flex-direction:column">

<div style="flex:none;height:22px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA">
<div role="group" aria-label="Connected: GPS, power meter, heart rate, phone" style="display:flex;align-items:center;gap:9px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 8-12h-6z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;line-height:1">
<span>14:32</span>
<span style="display:flex;align-items:center;gap:3px"><svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 10v4"></path><rect x="4.5" y="9.5" width="9" height="5" fill="currentColor" stroke="none"></rect></svg><span>68%</span></span>
</div>
</div>

<div style="flex:none;height:118px;box-sizing:border-box;padding:8px 8px 4px;display:flex;flex-direction:column;border-bottom:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">POWER · 3S</div>
<div style="flex:1;display:flex;align-items:center;gap:6px">
<span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:96px;line-height:84px;font-variant-numeric:tabular-nums;color:#F2F5F8">248</span>
<span style="align-self:flex-end;padding-bottom:12px;font-size:22px;font-weight:600;color:#9AA4B0">W</span>
<span style="margin-left:auto;padding:1px 8px;border-radius:5px;background:#F2C230;color:#0B0D10;font-size:20px;font-weight:700">Z4</span>
</div>
<div style="display:flex;gap:2px;height:8px">
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
<div style="flex:1;border-radius:2px;background:#F2C230"></div>
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
<div style="flex:1;border-radius:2px;background:#1B2027"></div>
</div>
</div>

<div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))">
<div style="box-sizing:border-box;padding:6px 8px;border-right:1px solid #232830;border-bottom:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">HEART RATE</div>
<div style="height:48px;display:flex;align-items:flex-end;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums">152</span><span style="padding-bottom:5px;font-size:13px;font-weight:600;color:#9AA4B0">bpm</span></div>
</div>
<div style="box-sizing:border-box;padding:6px 8px;border-bottom:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">CADENCE</div>
<div style="height:48px;display:flex;align-items:flex-end;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums">88</span><span style="padding-bottom:5px;font-size:13px;font-weight:600;color:#9AA4B0">rpm</span></div>
</div>
<div style="box-sizing:border-box;padding:6px 8px;border-right:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">SPEED</div>
<div style="height:48px;display:flex;align-items:flex-end;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums">32.4</span><span style="padding-bottom:5px;font-size:13px;font-weight:600;color:#9AA4B0">km/h</span></div>
</div>
<div style="box-sizing:border-box;padding:6px 8px">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">ELAPSED</div>
<div style="height:48px;display:flex;align-items:flex-end"><span style="padding-bottom:2px;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums">1:12:47</span></div>
</div>
</div>

<div style="flex:none;height:20px;display:flex;align-items:center;justify-content:center;gap:6px">
<span style="width:18px;height:6px;border-radius:3px;background:#F2F5F8"></span>
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":240,"height":320}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
