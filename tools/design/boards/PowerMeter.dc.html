<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power meter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:240px;height:320px;box-sizing:border-box;overflow:hidden;background:#0B0D10;color:#F2F5F8;font-family:'Barlow','Arial',sans-serif;display:flex;flex-direction:column">

<div style="flex:none;height:22px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA">
<div role="group" aria-label="Connected: GPS, power meter, heart rate, phone" style="display:flex;align-items:center;gap:9px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 8-12h-6z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;line-height:1">
<span>14:32</span>
<span style="display:flex;align-items:center;gap:3px"><svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 10v4"></path><rect x="4.5" y="9.5" width="9" height="5" fill="currentColor" stroke="none"></rect></svg><span>68%</span></span>
</div>
</div>

<div style="flex:none;height:44px;box-sizing:border-box;display:flex;align-items:center;border-bottom:1px solid #232830">
<button type="button" aria-label="Back to sensors" style="flex:none;width:44px;height:43px;margin:0;padding:0;border:0;background:transparent;color:#F2F5F8;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="flex:1;min-width:0;padding-right:8px;font-size:18px;font-weight:700;letter-spacing:.02em">Power meter</span>
<button type="button" aria-label="More: forget sensor" style="flex:none;display:flex;width:44px;height:43px;margin:0;padding:0;border:0;background:transparent;color:#F2F5F8;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
</div>

<div style="flex:none;height:44px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #232830">
<span style="display:flex;flex-direction:column"><span style="font-size:16px;font-weight:700;line-height:20px">PM500</span><span style="font-size:12px;font-weight:500;line-height:14px;color:#9AA4B0">···7C2E · Bluetooth</span></span>
<span style="box-sizing:border-box;height:22px;padding:0 8px;line-height:20px;border-radius:11px;font-size:11px;font-weight:700;letter-spacing:.06em;background:#1B2027;color:#F2F5F8;border:1px solid #3A424C">CONNECTED</span>
</div>

<div style="flex:none;height:66px;box-sizing:border-box;padding:6px 8px 0;border-bottom:1px solid #232830;display:flex;justify-content:space-between">
<div>
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">LIVE POWER</div>
<div style="display:flex;align-items:baseline;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:44px;line-height:44px;font-variant-numeric:tabular-nums">0</span><span style="font-size:16px;font-weight:600;color:#9AA4B0">W</span></div>
</div>
<div style="text-align:right">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">CADENCE</div>
<div style="display:flex;align-items:baseline;justify-content:flex-end;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:44px;line-height:44px;font-variant-numeric:tabular-nums">0</span><span style="font-size:16px;font-weight:600;color:#9AA4B0">rpm</span></div>
</div>
</div>

<div style="flex:none;height:112px;box-sizing:border-box;padding:6px 8px;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;height:16px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0"><span>ZERO OFFSET</span><span style="box-sizing:border-box;height:16px;padding:0 6px;line-height:14px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.06em;background:{{ chipBg }};color:{{ chipFg }};border:1px {{ chipBorder }}">{{ chipText }}</span></div>
<div style="height:34px;font-size:13px;font-weight:500;line-height:17px;color:#C9D1DA">{{ helpText }}</div>
<button type="button" style="margin:4px 0 0;padding:0;width:100%;height:44px;border:0;border-radius:10px;background:{{ btnBg }};color:{{ btnFg }};font-family:'Barlow','Arial',sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer">{{ btnText }}</button>
</div>

<div style="flex:none;height:32px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA;font-size:12px;font-weight:700;letter-spacing:.08em">
<span style="display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>BACK</span>
<span style="display:flex;align-items:center;gap:4px">{{ footerText }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","default":"idle","options":["idle","calibrating","done","failed"]},"$preview":{"width":240,"height":320}}'>
class Component extends DCLogic {
renderVals() {
const key = this.props.scenario || 'idle';
const table = {
idle: {
chipText: 'READY', chipBg: 'transparent', chipFg: '#F2F5F8', chipBorder: 'solid #3A424C',
help: 'Hold the bike upright with the cranks still and unloaded.',
btnText: 'CALIBRATE ZERO', btnBg: '#F2F5F8', btnFg: '#0B0D10', footer: 'CALIBRATE'
},
calibrating: {
chipText: 'IN PROGRESS', chipBg: 'transparent', chipFg: '#F2C230', chipBorder: 'dashed #F2C230',
help: 'Keep the cranks still. This takes a few seconds.',
btnText: 'CALIBRATING…', btnBg: '#1B2027', btnFg: '#9AA4B0', footer: 'WAIT'
},
done: {
chipText: 'ZERO SET', chipBg: '#3DBE6B', chipFg: '#0B0D10', chipBorder: 'solid #3DBE6B',
help: 'Zero offset set. Power should read about 0 W when still.',
btnText: 'DONE', btnBg: '#F2F5F8', btnFg: '#0B0D10', footer: 'DONE'
},
failed: {
chipText: 'FAILED', chipBg: '#E5484D', chipFg: '#0B0D10', chipBorder: 'solid #E5484D',
help: 'No response. Turn the crank once to wake the meter, then retry.',
btnText: 'RETRY', btnBg: '#F2F5F8', btnFg: '#0B0D10', footer: 'RETRY'
}
};
const cur = table[key] || table.idle;
return {
chipText: cur.chipText,
chipBg: cur.chipBg,
chipFg: cur.chipFg,
chipBorder: cur.chipBorder,
helpText: cur.help,
btnText: cur.btnText,
btnBg: cur.btnBg,
btnFg: cur.btnFg,
footerText: cur.footer
};
}
}
</script>
</body>
</html>
