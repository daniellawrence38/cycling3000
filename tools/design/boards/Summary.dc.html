<script type="text/x-dc" data-dc-script data-props='{"scenario": {"editor": "enum", "default": "waiting", "options": ["waiting", "uploaded"]}, "$preview": {"width": 240, "height": 320}}'>
class Component extends DCLogic {
renderVals() {
const key = this.props.scenario || 'waiting';
const table = {
 "waiting": {
  "chipText": "WAITING FOR PHONE",
  "chipFg": "#F2C230",
  "chipBorder": "dashed #F2C230"
 },
 "uploaded": {
  "chipText": "UPLOADED",
  "chipFg": "#F2F5F8",
  "chipBorder": "solid #3A424C"
 }
};
return table[key] || table['waiting'];
}
}
</script>
