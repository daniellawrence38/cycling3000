<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:240px;height:320px;box-sizing:border-box;overflow:hidden;background:#0B0D10;color:#F2F5F8;font-family:'Barlow','Arial',sans-serif;display:flex;flex-direction:column">

<div style="flex:none;height:22px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA">
<div role="group" aria-label="Connected: GPS, power meter, heart rate, phone" style="display:flex;align-items:center;gap:9px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 8-12h-6z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;line-height:1">
<span>14:32</span>
<span style="display:flex;align-items:center;gap:3px"><svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 10v4"></path><rect x="4.5" y="9.5" width="9" height="5" fill="currentColor" stroke="none"></rect></svg><span>68%</span></span>
</div>
</div>

<div style="flex:none;height:72px;box-sizing:border-box;padding:5px 8px 0;border-bottom:1px solid #232830">
<div style="display:flex;justify-content:space-between;height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0"><span>TIME REMAINING</span><span>INTERVAL 3 / 6</span></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:42px">
<span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:48px;line-height:42px;font-variant-numeric:tabular-nums">2:41</span>
<span style="font-size:15px;font-weight:700;letter-spacing:.06em;color:#F2F5F8">THRESHOLD</span>
</div>
<div style="height:6px;margin-top:4px;border-radius:3px;background:#1B2027;overflow:hidden"><div style="width:55%;height:100%;background:#F2F5F8"></div></div>
</div>

<div style="flex:none;height:94px;box-sizing:border-box;padding:6px 8px 0;border-bottom:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">POWER · 3S</div>
<div style="display:flex;align-items:center;height:70px">
<span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:76px;line-height:70px;font-variant-numeric:tabular-nums">{{ powerText }}</span>
<span style="align-self:flex-end;margin-left:4px;padding-bottom:10px;font-size:18px;font-weight:600;color:#9AA4B0">W</span>
<div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end">
<span style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">TARGET</span>
<span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:24px;line-height:26px;font-variant-numeric:tabular-nums">247–260</span>
</div>
</div>
</div>

<div style="flex:none;height:76px;box-sizing:border-box;padding:6px 8px 4px;border-bottom:1px solid #232830;display:flex;flex-direction:column;gap:4px">
<div style="height:24px;box-sizing:border-box;border-radius:6px;padding:0 8px;display:flex;align-items:center;gap:6px;background:{{ pillBg }};color:#0B0D10;font-size:13px;font-weight:700;letter-spacing:.04em">
<sc-if value="{{ isOk }}" hint-placeholder-val="{{ true }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
</sc-if>
<sc-if value="{{ isHigh }}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</sc-if>
<sc-if value="{{ isLow }}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg>
</sc-if>
<span>{{ statusText }}</span>
<span style="margin-left:auto;font-weight:600">{{ statusSub }}</span>
</div>
<div style="display:flex;justify-content:space-between;height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0"><span>TARGET Z4</span><span>{{ actualLabel }}</span></div>
<div style="display:flex;gap:3px;height:18px">
<sc-for list="{{ segs }}" as="seg" hint-placeholder-count="7">
<div style="flex:1;box-sizing:border-box;border:2px solid {{ seg.ring }};border-radius:4px;background:{{ seg.bg }};color:{{ seg.fg }};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1">{{ seg.label }}</div>
</sc-for>
</div>
</div>

<div style="flex:none;height:36px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">CADENCE</span>
<span style="display:flex;align-items:baseline;gap:4px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:32px;line-height:32px;font-variant-numeric:tabular-nums">92</span><span style="font-size:13px;font-weight:600;color:#9AA4B0">rpm</span></span>
</div>

<div style="flex:none;height:20px;display:flex;align-items:center;justify-content:center;gap:6px">
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
<span style="width:18px;height:6px;border-radius:3px;background:#F2F5F8"></span>
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
<span style="width:6px;height:6px;border-radius:3px;background:#5B6673"></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","default":"inrange","options":["inrange","high","low"]},"$preview":{"width":240,"height":320}}'>
class Component extends DCLogic {
renderVals() {
const key = this.props.scenario || 'inrange';
const table = {
inrange: { power: '252', zone: 4, text: 'IN RANGE', sub: 'on target', bg: '#3DBE6B' },
high: { power: '291', zone: 5, text: 'TOO HIGH', sub: '+31 W', bg: '#F08A24' },
low: { power: '214', zone: 3, text: 'TOO LOW', sub: '−33 W', bg: '#3B8BEB' }
};
const cur = table[key] || table.inrange;
const colours = ['#8E9AA6', '#3B8BEB', '#3DBE6B', '#F2C230', '#F08A24', '#E5484D', '#B46BE8'];
const segs = colours.map((c, i) => {
const n = i + 1;
const live = n === cur.zone;
return {
label: 'Z' + n,
bg: live ? c : '#1B2027',
fg: live ? '#0B0D10' : '#9AA4B0',
ring: n === 4 ? '#F2F5F8' : 'transparent'
};
});
return {
powerText: cur.power,
statusText: cur.text,
statusSub: cur.sub,
pillBg: cur.bg,
actualLabel: 'ACTUAL Z' + cur.zone,
isOk: cur === table.inrange,
isHigh: cur === table.high,
isLow: cur === table.low,
segs: segs
};
}
}
</script>
</body>
</html>
