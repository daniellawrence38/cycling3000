<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:240px;height:320px;box-sizing:border-box;overflow:hidden;background:#0B0D10;color:#F2F5F8;font-family:'Barlow','Arial',sans-serif;display:flex;flex-direction:column">

<div style="flex:none;height:22px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA">
<div role="group" aria-label="Connected: GPS, power meter, heart rate, phone" style="display:flex;align-items:center;gap:9px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 8-12h-6z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"></path></svg>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><path d="M11 18.5h2"></path></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;line-height:1">
<span>14:32</span>
<span style="display:flex;align-items:center;gap:3px"><svg width="16" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"></rect><path d="M22 10v4"></path><rect x="4.5" y="9.5" width="9" height="5" fill="currentColor" stroke="none"></rect></svg><span>68%</span></span>
</div>
</div>

<div style="flex:none;height:44px;box-sizing:border-box;display:flex;align-items:center;border-bottom:1px solid #232830">
<button type="button" aria-label="Back to workouts" style="flex:none;width:44px;height:43px;margin:0;padding:0;border:0;background:transparent;color:#F2F5F8;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="flex:1;min-width:0;padding-right:8px;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">4 x 8 min threshold</span>
</div>

<div style="flex:none;height:106px;box-sizing:border-box;padding:10px 8px 0">
<svg width="224" height="84" viewBox="0 0 224 84" role="img" aria-label="Workout profile: warm-up, four threshold intervals each followed by a recovery, then cool-down" style="display:block">
<line x1="0" y1="11.3" x2="224" y2="11.3" stroke="#5B6673" stroke-width="1" stroke-dasharray="3 3"></line>
<text x="224" y="9" text-anchor="end" font-family="Barlow, Arial, sans-serif" font-size="11" font-weight="600" fill="#9AA4B0">FTP</text>
<g stroke="#0B0D10" stroke-width="1">
<polygon points="0,84 0,47.6 32.94,33.1 32.94,84" fill="#3B8BEB"></polygon>
<rect x="32.94" y="13.1" width="26.35" height="70.9" fill="#F2C230"></rect>
<rect x="59.29" y="44" width="13.18" height="40" fill="#8E9AA6"></rect>
<rect x="72.47" y="13.1" width="26.35" height="70.9" fill="#F2C230"></rect>
<rect x="98.82" y="44" width="13.18" height="40" fill="#8E9AA6"></rect>
<rect x="112" y="13.1" width="26.35" height="70.9" fill="#F2C230"></rect>
<rect x="138.35" y="44" width="13.18" height="40" fill="#8E9AA6"></rect>
<rect x="151.53" y="13.1" width="26.35" height="70.9" fill="#F2C230"></rect>
<rect x="177.88" y="44" width="13.18" height="40" fill="#8E9AA6"></rect>
<polygon points="191.06,84 191.06,44 224,54.9 224,84" fill="#8E9AA6"></polygon>
</g>
</svg>
<div style="display:flex;justify-content:space-between;height:12px;line-height:12px;font-size:11px;font-weight:600;color:#9AA4B0"><span>0:00</span><span>1:08</span></div>
</div>

<div style="flex:none;height:48px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #232830">
<div style="box-sizing:border-box;padding:4px 8px 0;border-right:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">TIME</div>
<div style="height:26px;display:flex;align-items:baseline"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:28px;line-height:26px;font-variant-numeric:tabular-nums">1:08</span></div>
</div>
<div style="box-sizing:border-box;padding:4px 8px 0;border-right:1px solid #232830">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">STEPS</div>
<div style="height:26px;display:flex;align-items:baseline"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:28px;line-height:26px;font-variant-numeric:tabular-nums">10</span></div>
</div>
<div style="box-sizing:border-box;padding:4px 8px 0">
<div style="height:14px;line-height:14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#9AA4B0">FTP</div>
<div style="height:26px;display:flex;align-items:baseline;gap:3px"><span style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:28px;line-height:26px;font-variant-numeric:tabular-nums">260</span><span style="font-size:11px;font-weight:600;color:#9AA4B0">W</span></div>
</div>
</div>

<div style="flex:none;height:68px;box-sizing:border-box;padding:8px;border-top:1px solid #232830">
<button type="button" style="width:100%;height:100%;margin:0;padding:0;border:0;border-radius:10px;background:#F2F5F8;color:#0B0D10;font-family:'Barlow','Arial',sans-serif;font-size:18px;font-weight:700;letter-spacing:.06em;cursor:pointer">LOAD WORKOUT</button>
</div>

<div style="flex:none;height:32px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#12161B;color:#C9D1DA;font-size:12px;font-weight:700;letter-spacing:.08em">
<span style="display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>BACK</span>
<span style="display:flex;align-items:center;gap:4px">LOAD<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":240,"height":320}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
